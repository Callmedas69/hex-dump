name: Purge expired messages

on:
  schedule:
    # Every five minutes, offset from the busiest start-of-hour period (UTC).
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: purge-expired-messages-production
  cancel-in-progress: false

jobs:
  purge:
    if: github.repository == 'Callmedas69/hex-dump'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout or third-party actions: only call the protected production API.
      - name: Purge expired messages with retries
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          node <<'NODE'
          async function main() {
            const secret = process.env.CRON_SECRET;
            if (!secret || secret.length < 32) throw new Error('Configure the matching CRON_SECRET in GitHub Actions and Vercel production.');
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch('https://hexonion.0xdas.dev/api/cron/purge-drops', {
                  headers: { Authorization: `Bearer ${secret}` },
                  redirect: 'error',
                  signal: AbortSignal.timeout(55000),
                });
                if (!response.ok) throw new Error('Purge endpoint returned an error.');
                const result = await response.json();
                if (result.ok !== true || result.remaining !== false || !Number.isSafeInteger(result.deleted) || result.deleted < 0) throw new Error('Purge did not confirm completion.');
                console.log(`Purge complete: ${result.deleted} expired messages removed on attempt ${attempt}.`);
                return;
              } catch {
                console.error(`Purge attempt ${attempt} failed.`);
                if (attempt === 3) throw new Error('Purge failed after three attempts. Check the deployment and scheduler secret; the next scheduled run will try again.');
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }
          }
          main().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
